# =============================================================================
# build-cosmoscloud.yml — build the cosmoscloud package (repackaged from the
# official prebuilt Cosmos Cloud archives) across the architectures that have
# an upstream prebuilt binary.
#
# Prebuilt source split:
#   * amd64 / arm64  -> aseracorp/Cosmos-Server          (mirror of azukaar)
#   * 386/armv6/armv7/riscv64 -> aseracorp/Cosmos-Server-legacyArchs
#
# NOT scheduled. Triggered by:
#   * push to package/cosmoscloud/** (manual or via the upstream version-check
#     committing an updated Makefile), or
#   * workflow_dispatch (manual) — optionally pinning cosmos_version.
#
# On completion it uploads the built .apk files as a workflow artifact and
# records success/failure back in versions.json (for retry by version-check).
# Feed publishing (merging all packages into per-arch indexes) is done by
# publish.yml.
# =============================================================================

name: Build cosmoscloud

on:
  push:
    branches: [ main ]
    paths:
      - 'package/cosmoscloud/**'
  workflow_dispatch:
    inputs:
      cosmos_version:
        description: 'Cosmos Cloud release archive to package (e.g. 0.23.4). Empty = use versions.json'
        type: string
        default: ''

permissions:
  contents: write
  actions: write

concurrency:
  group: build-cosmoscloud
  cancel-in-progress: false

env:
  OPENWRT_RELEASE: 25.12.5

jobs:
  resolve-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Resolve Cosmos version
        id: resolve
        run: |
          set -euo pipefail
          VER="${{ inputs.cosmos_version }}"
          if [ -z "$VER" ]; then
            VER="$(python3 -c 'import json;print(json.load(open("versions.json"))["cosmoscloud"]["version"])')"
          fi
          echo "Using Cosmos version: $VER"
          echo "version=$VER" >> "$GITHUB_OUTPUT"

  build:
    needs: resolve-version
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - sdk_target: x86/64
            id: x86_64
            suffix: amd64
          - sdk_target: x86/generic
            id: x86_generic
            suffix: "386"
          - sdk_target: x86/legacy
            id: x86_legacy
            suffix: "386"
          - sdk_target: armsr/armv8
            id: armsr_armv8
            suffix: arm64
          - sdk_target: mediatek/filogic
            id: mtk_filogic
            suffix: arm64
          - sdk_target: bcm27xx/bcm2711
            id: bcm2711
            suffix: arm64
          - sdk_target: bcm27xx/bcm2712
            id: bcm2712
            suffix: arm64
          - sdk_target: bcm27xx/bcm2708
            id: bcm2708
            suffix: armv6
          - sdk_target: mediatek/mt7629
            id: mt7629
            suffix: armv7
          - sdk_target: ipq806x/generic
            id: ipq806x
            suffix: armv7
          - sdk_target: ipq40xx/generic
            id: ipq40xx
            suffix: armv7
          - sdk_target: sunxi/cortexa8
            id: sunxi_a8
            suffix: armv7
          - sdk_target: bcm53xx/generic
            id: bcm53xx
            suffix: armv7
          - sdk_target: mvebu/cortexa9
            id: mvebu_a9
            suffix: armv7
          - sdk_target: at91/sama5
            id: at91_sama5
            suffix: armv7
          - sdk_target: at91/sama7
            id: at91_sama7
            suffix: armv7
          - sdk_target: zynq/generic
            id: zynq
            suffix: armv7
          - sdk_target: d1/generic
            id: d1
            suffix: riscv64
    env:
      COSMOS_VERSION: ${{ needs.resolve-version.outputs.version }}
    steps:
      - name: Checkout feed
        uses: actions/checkout@v4
        with:
          path: feed

      - name: OpenWrt SDK setup
        uses: ./feed/.github/actions/openwrt-sdk
        with:
          openwrt_release: ${{ env.OPENWRT_RELEASE }}
          sdk_target: ${{ matrix.sdk_target }}

      - name: Install package & key into SDK
        run: |
          set -euo pipefail
          mkdir -p sdk/package/snapraid
          cp feed/package/snapraid/Makefile sdk/package/snapraid/Makefile
          rm -rf sdk/package/cosmoscloud
          cp -r feed/package/cosmoscloud sdk/package/cosmoscloud
          echo "CONFIG_PACKAGE_snapraid=y" > sdk/.config
          echo "CONFIG_PACKAGE_cosmoscloud=m" >> sdk/.config
          echo "CONFIG_SIGNED_PACKAGES=y" >> sdk/.config

      - name: Fetch & stage Cosmos prebuilt (${{ matrix.suffix }})
        run: |
          set -euo pipefail
          SUFFIX="${{ matrix.suffix }}"
          VER="${{ env.COSMOS_VERSION }}"
          case "$SUFFIX" in
            amd64|arm64) REPO="aseracorp/Cosmos-Server" ;;
            *)           REPO="aseracorp/Cosmos-Server-legacyArchs" ;;
          esac
          ZIP="cosmos-cloud-${VER}-${SUFFIX}.zip"
          curl -fL "https://github.com/${REPO}/releases/download/v${VER}/${ZIP}" -o "/tmp/${ZIP}"
          curl -fL "https://github.com/${REPO}/releases/download/v${VER}/${ZIP}.md5" -o "/tmp/${ZIP}.md5" || true
          if [ -f "/tmp/${ZIP}.md5" ]; then
            ( cd /tmp && md5sum -c "${ZIP}.md5" )
          fi
          rm -rf /tmp/cosmos-x && mkdir -p /tmp/cosmos-x sdk/package/cosmoscloud/prebuilt
          unzip -o "/tmp/${ZIP}" -d /tmp/cosmos-x >/dev/null
          SRC="$(find /tmp/cosmos-x -mindepth 1 -maxdepth 1 -type d | head -1)"
          cp -a "$SRC"/. sdk/package/cosmoscloud/prebuilt/
          chmod +x sdk/package/cosmoscloud/prebuilt/cosmos 2>/dev/null || true

      - name: Build cosmoscloud
        run: |
          cd sdk
          make defconfig >/dev/null 2>&1
          make package/cosmoscloud/compile 2>&1 | tail -20

      - name: Collect & rename apk
        run: |
          set -euo pipefail
          cd sdk
          ARCHARCH="$(ls bin/packages | head -1)"
          echo "Architecture: $ARCHARCH"
          rm -rf /tmp/assets && mkdir -p /tmp/assets
          for f in "bin/packages/$ARCHARCH/base"/*.apk; do
            [ -f "$f" ] || continue
            base=$(basename "$f")
            case "$base" in
              cosmoscloud-*) name=cosmoscloud ;;
              snapraid-*)    name=snapraid ;;
              *) continue ;;
            esac
            ver="${base#$name-}"; ver="${ver%.apk}"
            cp "$f" "/tmp/assets/${name}_${ver}_${ARCHARCH}.apk"
          done
          ls -la /tmp/assets

      - name: Upload cosmoscloud apks
        uses: actions/upload-artifact@v4
        with:
          name: cosmoscloud-apks-${{ matrix.id }}
          path: /tmp/assets/*.apk
          if-no-files-found: error

  report-status:
    needs: [ build, resolve-version ]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Record build status
        env:
          BUILT_VERSION: ${{ needs.resolve-version.outputs.version }}
        run: |
          set -euo pipefail
          python3 - <<'EOF'
          import json, datetime, os
          with open('versions.json') as f: v = json.load(f)
          v['cosmoscloud']['status'] = '${{ needs.build.result }}'
          if os.environ.get('BUILT_VERSION'):
              v['cosmoscloud']['version'] = os.environ['BUILT_VERSION']
          v['cosmoscloud']['built_at'] = datetime.datetime.now(datetime.timezone.utc).isoformat()
          with open('versions.json', 'w') as f:
              json.dump(v, f, indent=2); f.write('\n')
          EOF
          git diff versions.json

      - name: Commit status
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add versions.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(feed): cosmoscloud build status -> ${{ needs.build.result }}"
            git push origin HEAD:main
          else
            echo "no change"
          fi

      - name: Trigger publish
        if: needs.build.result == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # workflow_run-based publish does not fire for workflow_dispatch-
          # dispatched builds, so dispatch it explicitly after a successful
          # build. publish.yml serializes via concurrency and always merges
          # the latest successful artifacts of all three build workflows.
          echo "Dispatching Publish feed"
          gh workflow run "Publish feed" --repo ${{ github.repository }} --ref main
