# =============================================================================
# build-mergerfs.yml — build the mergerfs package on architectures that have
# an upstream prebuilt static binary (repackaged from the official mergerfs
# release tarballs).
#
# NOT scheduled. Triggered by:
#   * push to package/mergerfs/** (manual or via the upstream version-check
#     committing an updated Makefile), or
#   * workflow_dispatch (manual).
#
# On completion it uploads the built .apk files as a workflow artifact and
# records success/failure back in versions.json (for retry by version-check).
# Feed publishing (merging all packages into per-arch indexes) is done by
# publish.yml.
# =============================================================================

name: Build mergerfs

on:
  push:
    branches: [ main ]
    paths:
      - 'package/mergerfs/**'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: build-mergerfs
  cancel-in-progress: false

env:
  OPENWRT_RELEASE: 25.12.5

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - sdk_target: x86/64
            id: x86_64
            suffix: amd64
          - sdk_target: x86/generic
            id: x86_generic
            suffix: i386
          - sdk_target: x86/legacy
            id: x86_legacy
            suffix: i386
          - sdk_target: armsr/armv8
            id: armsr_armv8
            suffix: arm64
          - sdk_target: mediatek/filogic
            id: mtk_filogic
            suffix: arm64
          - sdk_target: bcm27xx/bcm2711
            id: bcm2711
            suffix: arm64
          - sdk_target: bcm27xx/bcm2712
            id: bcm2712
            suffix: arm64
          - sdk_target: mediatek/mt7629
            id: mt7629
            suffix: armhf
          - sdk_target: ipq806x/generic
            id: ipq806x
            suffix: armhf
          - sdk_target: ipq40xx/generic
            id: ipq40xx
            suffix: armhf
          - sdk_target: sunxi/cortexa8
            id: sunxi_a8
            suffix: armhf
          - sdk_target: bcm53xx/generic
            id: bcm53xx
            suffix: armhf
          - sdk_target: mvebu/cortexa9
            id: mvebu_a9
            suffix: armhf
          - sdk_target: at91/sama5
            id: at91_sama5
            suffix: armhf
          - sdk_target: at91/sama7
            id: at91_sama7
            suffix: armhf
          - sdk_target: zynq/generic
            id: zynq
            suffix: armhf
          - sdk_target: d1/generic
            id: d1
            suffix: riscv64
    steps:
      - name: Checkout feed
        uses: actions/checkout@v4
        with:
          path: feed

      - name: OpenWrt SDK setup
        uses: ./feed/.github/actions/openwrt-sdk
        with:
          openwrt_release: ${{ env.OPENWRT_RELEASE }}
          sdk_target: ${{ matrix.sdk_target }}

      - name: Install package & key into SDK
        run: |
          set -euo pipefail
          rm -rf sdk/package/mergerfs
          cp -r feed/package/mergerfs sdk/package/mergerfs
          echo "CONFIG_PACKAGE_mergerfs=y" > sdk/.config
          echo "CONFIG_SIGNED_PACKAGES=y" >> sdk/.config

      - name: Fetch & stage mergerfs prebuilt (${{ matrix.suffix }})
        run: |
          set -euo pipefail
          SUF="${{ matrix.suffix }}"
          VER="$(grep -E '^PKG_VERSION' sdk/package/mergerfs/Makefile | head -1 | sed -E 's/.*:= *//')"
          TGZ="mergerfs-${VER}-static-linux_${SUF}.tar.gz"
          curl -fL "https://github.com/trapexit/mergerfs/releases/download/${VER}/${TGZ}" -o "/tmp/${TGZ}"
          rm -rf /tmp/mf-x && mkdir -p /tmp/mf-x sdk/package/mergerfs/prebuilt
          tar xzf "/tmp/${TGZ}" -C /tmp/mf-x
          cp -a /tmp/mf-x/usr sdk/package/mergerfs/prebuilt/
          cp -a /tmp/mf-x/sbin sdk/package/mergerfs/prebuilt/ 2>/dev/null || true
          chmod +x sdk/package/mergerfs/prebuilt/usr/local/bin/mergerfs 2>/dev/null || true

      - name: Build mergerfs
        run: |
          cd sdk
          make defconfig >/dev/null 2>&1
          make package/mergerfs/compile 2>&1 | tail -20

      - name: Collect & rename apk
        run: |
          set -euo pipefail
          cd sdk
          ARCHARCH="$(ls bin/packages | head -1)"
          echo "Architecture: $ARCHARCH"
          rm -rf /tmp/assets && mkdir -p /tmp/assets
          for f in "bin/packages/$ARCHARCH/base"/*.apk; do
            [ -f "$f" ] || continue
            base=$(basename "$f")
            case "$base" in
              mergerfs-*) name=mergerfs ;;
              *) continue ;;
            esac
            ver="${base#$name-}"; ver="${ver%.apk}"
            cp "$f" "/tmp/assets/${name}_${ver}_${ARCHARCH}.apk"
          done
          ls -la /tmp/assets

      - name: Upload mergerfs apks
        uses: actions/upload-artifact@v4
        with:
          name: mergerfs-apks-${{ matrix.id }}
          path: /tmp/assets/*.apk
          if-no-files-found: error

  report-status:
    needs: build
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Record build status
        run: |
          set -euo pipefail
          BUILT_VERSION="$(grep -E '^PKG_VERSION' package/mergerfs/Makefile | head -1 | sed -E 's/.*:= *//')"
          python3 - "$BUILT_VERSION" <<'EOF'
          import json, datetime, sys
          with open('versions.json') as f: v = json.load(f)
          v['mergerfs']['status'] = '${{ needs.build.result }}'
          if sys.argv[1]:
              v['mergerfs']['version'] = sys.argv[1]
          v['mergerfs']['built_at'] = datetime.datetime.now(datetime.timezone.utc).isoformat()
          with open('versions.json', 'w') as f:
              json.dump(v, f, indent=2); f.write('\n')
          EOF
          git diff versions.json

      - name: Commit status
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add versions.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(feed): mergerfs build status -> ${{ needs.build.result }}"
            git push origin HEAD:main
          else
            echo "no change"
          fi

      - name: Trigger publish
        if: needs.build.result == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # workflow_run-based publish does not fire for workflow_dispatch-
          # dispatched builds, so dispatch it explicitly after a successful
          # build. publish.yml serializes via concurrency and always merges
          # the latest successful artifacts of all three build workflows.
          echo "Dispatching Publish feed"
          gh workflow run "Publish feed" --repo ${{ github.repository }} --ref main
