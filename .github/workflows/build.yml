# Builds the aseracorp/openwrt-packages feed (SnapRAID + Cosmos Cloud) for
# every supported OpenWrt architecture, signs the indexes, and publishes.
#
# Storage model (keeps gh-pages tiny, well under GitHub's 1GB site limit):
#   * The large .apk binaries are uploaded to a GitHub Release as assets,
#     named <name>_<version>_<arch>.apk.
#   * Each per-architecture apk index (packages.adb) is generated with an
#     ABSOLUTE pkgname-spec pointing at that release:
#       https://github.com/aseracorp/openwrt-packages/releases/download/<TAG>/
#           ${name}_${version}_${arch}.apk
#     apk substitutes ${name}/${version}/${arch} and fetches the .apk straight
#     from the release, so the gh-pages branch only holds the tiny index +
#     public key (~1KB per arch) - no package blobs in git.
#
# Two packages are built in each SDK job:
#   * snapraid    - compiled from source.
#   * cosmoscloud - re-packaged from the official prebuilt archives (Go
#                   statically-linked + web assets). Only builds on archs with
#                   a prebuilt archive (amd64, arm64, 386, armv6, armv7,
#                   riscv64); matrix field `cosmos` selects the prebuilt suffix,
#                   empty => snapraid only.
#
# Signing (OpenWrt apk uses an EC P-256 key, NOT usign):
#   openssl ecparam -name prime256v1 -genkey -noout -out private.key
#   openssl ec -in private.key -pubout > <KEYID>.pub
#   KEYID = first 16 hex chars of SHA-512 of the SEC1 uncompressed EC point
#   (0x04||X||Y). Store base64(private.key) as repo secret APK_SIGNING_KEY.

name: Build & publish

on:
  schedule:
    - cron: '45 3 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Rebuild all packages'
        type: boolean
        default: false
      cosmos_version:
        description: 'Cosmos Cloud release to package'
        type: string
        default: '0.23.0-unstable013'
      release_tag:
        description: 'GitHub release tag the index will point at'
        type: string
        default: 'feed-v1'
  push:
    branches: [ main ]
    paths:
      - 'package/**'
      - '.github/workflows/**'
      - 'keys/**'

permissions:
  contents: write

concurrency:
  group: openwrt-feed-v2
  cancel-in-progress: true

env:
  OPENWRT_RELEASE: 25.12.5
  KEYID: 99e1cb28ae4fa8b3        # matches keys/99e1cb28ae4fa8b3.pub (EC P-256)
  COSMOS_VERSION: ${{ inputs.cosmos_version || '0.23.0-unstable013' }}
  RELEASE_TAG: ${{ inputs.release_tag || 'feed-v1' }}

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - sdk_target: x86/64
            id: x86_64
            cosmos: amd64
          - sdk_target: x86/generic
            id: x86_generic
            cosmos: "386"
          - sdk_target: x86/legacy
            id: x86_legacy
            cosmos: "386"
          - sdk_target: armsr/armv8
            id: armsr_armv8
            cosmos: arm64
          - sdk_target: mediatek/filogic
            id: mtk_filogic
            cosmos: arm64
          - sdk_target: bcm27xx/bcm2711
            id: bcm2711
            cosmos: arm64
          - sdk_target: bcm27xx/bcm2712
            id: bcm2712
            cosmos: arm64
          - sdk_target: bcm27xx/bcm2708
            id: bcm2708
            cosmos: armv6
          - sdk_target: mediatek/mt7629
            id: mt7629
            cosmos: armv7
          - sdk_target: ipq806x/generic
            id: ipq806x
            cosmos: armv7
          - sdk_target: ipq40xx/generic
            id: ipq40xx
            cosmos: armv7
          - sdk_target: sunxi/cortexa8
            id: sunxi_a8
            cosmos: armv7
          - sdk_target: bcm53xx/generic
            id: bcm53xx
            cosmos: armv7
          - sdk_target: mvebu/cortexa9
            id: mvebu_a9
            cosmos: armv7
          - sdk_target: at91/sama5
            id: at91_sama5
            cosmos: armv7
          - sdk_target: at91/sama7
            id: at91_sama7
            cosmos: armv7
          - sdk_target: zynq/generic
            id: zynq
            cosmos: armv7
          - sdk_target: d1/generic
            id: d1
            cosmos: riscv64
          # --- snapraid-only (no prebuilt Cosmos binary) ---
          - sdk_target: at91/sam9x
            id: at91_sam9x
          - sdk_target: ramips/mt7621
            id: mt7621
          - sdk_target: ath79/generic
            id: ath79
          - sdk_target: bmips/bcm6328
            id: bcm6328
          - sdk_target: bcm47xx/mips74k
            id: bcm47xx_74k
          - sdk_target: bcm47xx/generic
            id: bcm47xx
          - sdk_target: pistachio/generic
            id: pistachio
          - sdk_target: octeon/generic
            id: octeon
          - sdk_target: malta/be64
            id: malta_be64
          - sdk_target: malta/le64
            id: malta_le64
          - sdk_target: loongarch64/generic
            id: loongarch64
          - sdk_target: mpc85xx/p2020
            id: mpc85xx_p2020
          - sdk_target: qoriq/generic
            id: qoriq
          - sdk_target: apm821xx/nand
            id: apm821xx
          - sdk_target: gemini/generic
            id: gemini
          - sdk_target: kirkwood/generic
            id: kirkwood
          - sdk_target: ixp4xx/generic
            id: ixp4xx

    steps:
      - name: Checkout feed
        uses: actions/checkout@v4
        with:
          path: feed

      - name: Install host build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential file libncurses-dev zlib1g-dev gawk gettext \
            libssl-dev xsltproc rsync wget unzip zstd python3 jq curl bzip2 patch openssl

      - name: Cache OpenWrt SDK (${{ matrix.sdk_target }})
        id: cache-sdk
        uses: actions/cache@v4
        with:
          path: /tmp/sdk.tar.zst
          key: openwrt-sdk-${{ env.OPENWRT_RELEASE }}-${{ matrix.sdk_target }}

      - name: Download & extract OpenWrt SDK
        run: |
          set -euo pipefail
          if [ ! -f /tmp/sdk.tar.zst ]; then
            BASE="https://downloads.openwrt.org/releases/${OPENWRT_RELEASE}/targets/${{ matrix.sdk_target }}/"
            SDK="$(curl -fsSL "$BASE" | grep -oE 'openwrt-sdk-[^"]*\.tar\.zst' | grep -v sha256 | head -1)"
            [ -n "$SDK" ] || { echo "ERROR: no SDK for ${{ matrix.sdk_target }}"; exit 1; }
            curl -fsSL "$BASE/$SDK" -o /tmp/sdk.tar.zst
          fi
          mkdir -p sdk
          tar --zstd -xf /tmp/sdk.tar.zst -C sdk --strip-components=1

      - name: Install packages & key into SDK
        run: |
          set -euo pipefail
          mkdir -p sdk/package/snapraid
          cp feed/package/snapraid/Makefile sdk/package/snapraid/Makefile
          rm -rf sdk/package/cosmoscloud
          cp -r feed/package/cosmoscloud sdk/package/cosmoscloud
          echo "CONFIG_PACKAGE_snapraid=y" > sdk/.config
          echo "CONFIG_PACKAGE_cosmoscloud=m" >> sdk/.config
          echo "CONFIG_SIGNED_PACKAGES=y" >> sdk/.config
          if [ -n "${APK_SIGNING_KEY:-}" ]; then
            echo "$APK_SIGNING_KEY" | base64 -d > sdk/private-key.pem
            chmod 600 sdk/private-key.pem
            openssl ec -in sdk/private-key.pem -pubout -out sdk/public-key.pem 2>/dev/null || true
          fi

      - name: Build snapraid
        run: |
          cd sdk
          make defconfig >/dev/null 2>&1
          make package/snapraid/compile 2>&1 | tail -20

      - name: Fetch & stage Cosmos prebuilt (${{ matrix.cosmos }})
        if: ${{ matrix.cosmos != '' }}
        run: |
          set -euo pipefail
          SUFFIX="${{ matrix.cosmos }}"
          VER="${{ env.COSMOS_VERSION }}"
          case "$SUFFIX" in
            amd64|arm64) REPO="aseracorp/Cosmos-Server" ;;
            *)           REPO="aseracorp/Cosmos-Server-legacyArchs" ;;
          esac
          ZIP="cosmos-cloud-${VER}-${SUFFIX}.zip"
          curl -fL "https://github.com/${REPO}/releases/download/v${VER}/${ZIP}" -o "/tmp/${ZIP}"
          curl -fL "https://github.com/${REPO}/releases/download/v${VER}/${ZIP}.md5" -o "/tmp/${ZIP}.md5"
          ( cd /tmp && md5sum -c "${ZIP}.md5" )
          rm -rf /tmp/cosmos-x && mkdir -p /tmp/cosmos-x sdk/package/cosmoscloud/prebuilt
          unzip -o "/tmp/${ZIP}" -d /tmp/cosmos-x >/dev/null
          SRC="$(find /tmp/cosmos-x -mindepth 1 -maxdepth 1 -type d | head -1)"
          cp -a "$SRC"/. sdk/package/cosmoscloud/prebuilt/
          chmod +x sdk/package/cosmoscloud/prebuilt/cosmos 2>/dev/null || true

      - name: Build cosmoscloud
        if: ${{ matrix.cosmos != '' }}
        run: |
          cd sdk
          make package/cosmoscloud/compile 2>&1 | tail -20

      - name: Collect, rename apks & generate signed index
        id: idx
        run: |
          set -euo pipefail
          cd sdk
          ARCHARCH="$(ls bin/packages | head -1)"
          REPODIR="bin/packages/$ARCHARCH/base"
          echo "Architecture: $ARCHARCH"
          rm -rf /tmp/assets && mkdir -p /tmp/assets
          for f in "$REPODIR"/*.apk; do
            [ -f "$f" ] || continue
            base=$(basename "$f")
            case "$base" in
              cosmoscloud-*) name=cosmoscloud ;;
              snapraid-*)    name=snapraid ;;
              *) continue ;;
            esac
            ver="${base#$name-}"; ver="${ver%.apk}"
            cp "$f" "/tmp/assets/${name}_${ver}_${ARCHARCH}.apk"
          done
          echo "assets:"; ls -la /tmp/assets
          echo "ARCHARCH=$ARCHARCH" >> "$GITHUB_OUTPUT"

      - name: Run apk mkndx with absolute pkgname-spec (+sign)
        run: |
          set -euo pipefail
          ARCHARCH="${{ steps.idx.outputs.ARCHARCH }}"
          cd "sdk/bin/packages/$ARCHARCH/base"
          APKPATH="../../../../staging_dir/host/bin/apk"
          ROOT="../../../../"
          RELEASE_TAG="${{ env.RELEASE_TAG }}"
          SPEC="https://github.com/aseracorp/openwrt-packages/releases/download/$RELEASE_TAG/\${name}_\${version}_\${arch}.apk"
          echo "generating signed index for $ARCHARCH ..."
          rm -f packages.adb
          if [ -n "${APK_SIGNING_KEY:-}" ] && [ -f "$ROOT/private-key.pem" ]; then
            "$APKPATH" mkndx --root "$ROOT" --allow-untrusted \
              --sign "$ROOT/private-key.pem" \
              --pkgname-spec "$SPEC" --output packages.adb /tmp/assets/*.apk 2>&1 | tail -8
          else
            "$APKPATH" mkndx --root "$ROOT" --allow-untrusted \
              --pkgname-spec "$SPEC" --output packages.adb /tmp/assets/*.apk 2>&1 | tail -8
          fi
          ls -la packages.adb

      - name: Stage index + pubkey for gh-pages
        run: |
          set -euo pipefail
          ARCHARCH="${{ steps.idx.outputs.ARCHARCH }}"
          rm -rf /tmp/stage && mkdir -p "/tmp/stage/$ARCHARCH"
          cp "$GITHUB_WORKSPACE/sdk/bin/packages/$ARCHARCH/base/packages.adb" "/tmp/stage/$ARCHARCH/"
          cp "$GITHUB_WORKSPACE/feed/keys/${{ env.KEYID }}.pub" "/tmp/stage/$ARCHARCH/"
          ls -la "/tmp/stage/$ARCHARCH/"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: out-${{ matrix.id }}
          path: |
            /tmp/assets/
            /tmp/stage/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts (merged)
        uses: actions/download-artifact@v4
        with:
          path: all
          merge-multiple: true

      - name: Collect apks & verify
        run: |
          set -euo pipefail
          mkdir -p /tmp/apks
          find all -maxdepth 1 -name '*.apk' -exec cp {} /tmp/apks/ \;
          echo "apk count: $(ls /tmp/apks | wc -l)"
          ls /tmp/apks | head
          echo "--- arch dirs (indexes + pub) ---"
          find all -maxdepth 2 -type d | head -40

      - name: Upload apks to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: "openwrt-packages feed (${{ env.RELEASE_TAG }})"
          body: |
            Prebuilt OpenWrt apk packages for SnapRAID + Cosmos Cloud.
            Index: https://aseracorp.github.io/openwrt-packages/<arch>/packages.adb
          files: /tmp/apks/*
          fail_on_unmatched_files: false

      - name: Assemble gh-pages (indexes + pubkey only)
        run: |
          set -euo pipefail
          rm -rf site
          git clone --depth 1 --branch gh-pages https://github.com/aseracorp/openwrt-packages.git site 2>/dev/null || mkdir site
          cd site
          for d in */; do
            case "$d" in
              index.html|latest-cosmos|*.md) continue ;;
              */) rm -rf "$d" ;;
            esac
          done
          cd ..
          for arch in all/*/; do
            an="$(basename "$arch")"
            [ -f "$arch/packages.adb" ] || continue
            mkdir -p "site/$an"
            cp "$arch/packages.adb" "site/$an/"
            cp "$arch"/*.pub "site/$an/" 2>/dev/null || true
          done
          echo "${{ env.COSMOS_VERSION }}" > site/latest-cosmos
          cd site
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -q -m "Publish feed indexes (${{ env.RELEASE_TAG }})"
            git push origin gh-pages
            echo "gh-pages pushed"
          else
            echo "no change"
          fi