# =============================================================================
# build-snapraid.yml — build the snapraid package across all supported OpenWrt
# architectures, from source (OpenWrt SDK).
#
# NOT scheduled. Triggered by:
#   * push to package/snapraid/** (manual or via the upstream version-check
#     committing an updated Makefile), or
#   * workflow_dispatch (manual).
#
# On completion it uploads the built .apk files as a workflow artifact and
# records success/failure back in versions.json so the version-check workflow
# knows whether a retry is needed. Publishing the merged multi-package feed is
# handled separately by publish.yml (workflow_run).
# =============================================================================

name: Build snapraid

on:
  push:
    branches: [ main ]
    paths:
      - 'package/snapraid/**'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: build-snapraid
  cancel-in-progress: false

env:
  OPENWRT_RELEASE: 25.12.5

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - sdk_target: x86/64
            id: x86_64
          - sdk_target: x86/generic
            id: x86_generic
          - sdk_target: x86/legacy
            id: x86_legacy
          - sdk_target: armsr/armv8
            id: armsr_armv8
          - sdk_target: mediatek/filogic
            id: mtk_filogic
          - sdk_target: bcm27xx/bcm2711
            id: bcm2711
          - sdk_target: bcm27xx/bcm2712
            id: bcm2712
          - sdk_target: bcm27xx/bcm2708
            id: bcm2708
          - sdk_target: mediatek/mt7629
            id: mt7629
          - sdk_target: ipq806x/generic
            id: ipq806x
          - sdk_target: ipq40xx/generic
            id: ipq40xx
          - sdk_target: sunxi/cortexa8
            id: sunxi_a8
          - sdk_target: bcm53xx/generic
            id: bcm53xx
          - sdk_target: mvebu/cortexa9
            id: mvebu_a9
          - sdk_target: at91/sama5
            id: at91_sama5
          - sdk_target: at91/sama7
            id: at91_sama7
          - sdk_target: zynq/generic
            id: zynq
          - sdk_target: d1/generic
            id: d1
          - sdk_target: at91/sam9x
            id: at91_sam9x
          - sdk_target: ramips/mt7621
            id: mt7621
          - sdk_target: ath79/generic
            id: ath79
          - sdk_target: bmips/bcm6328
            id: bcm6328
          - sdk_target: bcm47xx/mips74k
            id: bcm47xx_74k
          - sdk_target: bcm47xx/generic
            id: bcm47xx
          - sdk_target: pistachio/generic
            id: pistachio
          - sdk_target: octeon/generic
            id: octeon
          - sdk_target: malta/be64
            id: malta_be64
          - sdk_target: malta/le64
            id: malta_le64
          - sdk_target: loongarch64/generic
            id: loongarch64
          - sdk_target: mpc85xx/p2020
            id: mpc85xx_p2020
          - sdk_target: qoriq/generic
            id: qoriq
          - sdk_target: apm821xx/nand
            id: apm821xx
          - sdk_target: gemini/generic
            id: gemini
          - sdk_target: kirkwood/generic
            id: kirkwood
          - sdk_target: ixp4xx/generic
            id: ixp4xx
    steps:
      - name: Checkout feed
        uses: actions/checkout@v4
        with:
          path: feed

      - name: OpenWrt SDK setup
        uses: ./feed/.github/actions/openwrt-sdk
        with:
          openwrt_release: ${{ env.OPENWRT_RELEASE }}
          sdk_target: ${{ matrix.sdk_target }}

      - name: Install package & key into SDK
        run: |
          set -euo pipefail
          mkdir -p sdk/package/snapraid
          cp feed/package/snapraid/Makefile sdk/package/snapraid/Makefile
          echo "CONFIG_PACKAGE_snapraid=y" > sdk/.config
          echo "CONFIG_SIGNED_PACKAGES=y" >> sdk/.config

      - name: Build snapraid
        run: |
          cd sdk
          make defconfig >/dev/null 2>&1
          make package/snapraid/compile 2>&1 | tail -20

      - name: Collect & rename apk
        run: |
          set -euo pipefail
          cd sdk
          ARCHARCH="$(ls bin/packages | head -1)"
          echo "Architecture: $ARCHARCH"
          rm -rf /tmp/assets && mkdir -p /tmp/assets
          for f in "bin/packages/$ARCHARCH/base"/*.apk; do
            [ -f "$f" ] || continue
            base=$(basename "$f")
            case "$base" in
              snapraid-*) name=snapraid ;;
              *) continue ;;
            esac
            ver="${base#$name-}"; ver="${ver%.apk}"
            cp "$f" "/tmp/assets/${name}_${ver}_${ARCHARCH}.apk"
          done
          ls -la /tmp/assets

      - name: Upload snapraid apks
        uses: actions/upload-artifact@v4
        with:
          name: snapraid-apks-${{ matrix.id }}
          path: /tmp/assets/*.apk
          if-no-files-found: error

  report-status:
    needs: build
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Record build status
        run: |
          set -euo pipefail
          BUILT_VERSION="$(grep -E '^PKG_VERSION' package/snapraid/Makefile | head -1 | sed -E 's/.*:= *//')"
          python3 - "$BUILT_VERSION" <<'EOF'
          import json, datetime, sys
          with open('versions.json') as f: v = json.load(f)
          v['snapraid']['status'] = '${{ needs.build.result }}'
          if sys.argv[1]:
              v['snapraid']['version'] = sys.argv[1]
          v['snapraid']['built_at'] = datetime.datetime.now(datetime.timezone.utc).isoformat()
          with open('versions.json', 'w') as f:
              json.dump(v, f, indent=2); f.write('\n')
          EOF
          git diff versions.json

      - name: Commit status
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add versions.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(feed): snapraid build status -> ${{ needs.build.result }}"
            # Push with rebase-retry: the three build workflows run in
            # parallel and all update versions.json on main, so a plain push
            # can be rejected (non-fast-forward). Rebase onto the latest main
            # and retry a few times before giving up.
            n=0
            while :; do
              if git push origin HEAD:main 2>/dev/null; then
                break
              fi
              n=$((n+1))
              if [ "$n" -ge 5 ]; then
                echo "ERROR: could not push after 5 attempts" >&2
                exit 1
              fi
              echo "push rejected (concurrent update), rebasing and retrying ($n/5)"
              git pull --rebase origin main
            done
          else
            echo "no change"
          fi

      - name: Trigger publish
        if: needs.build.result == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # workflow_run-based publish does not fire for workflow_dispatch-
          # dispatched builds, so dispatch it explicitly after a successful
          # build. publish.yml serializes via concurrency and always merges
          # the latest successful artifacts of all three build workflows.
          echo "Dispatching Publish feed"
          gh workflow run "Publish feed" --repo ${{ github.repository }} --ref main
